name: pure-noise
version: 0.2.2.0
github: "jtnuttall/pure-noise"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "2026 Jeremy Nuttall"

extra-source-files:
  - README.md
  - LICENSE
  - LICENSE_FastNoiseLite

extra-doc-files:
  - CHANGELOG.md

synopsis: Performant, modern noise generation (Perlin, OpenSimplex2, Cellular)
category: Math, Numeric, Noise

description: |
  Fast, modern noise generation In pure Haskell with an algebraic interface.
  Provides Perlin, OpenSimplex2, OpenSimplex2S, Value, and Cellular noise variants.

language: GHC2021

dependencies:
  - base >= 4.16 && < 5
  - primitive >= 0.8 && < 0.10

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Numeric.Noise
    - Numeric.Noise.Cellular
    - Numeric.Noise.Fractal
    - Numeric.Noise.OpenSimplex
    - Numeric.Noise.Perlin
    - Numeric.Noise.SuperSimplex
    - Numeric.Noise.Value
    - Numeric.Noise.ValueCubic
  when:
    - condition: flag(optimize)
      ghc-options:
        - -O2
    - condition: flag(mfma)
      ghc-options:
        - -mfma
      cpp-options:
        - -DHAS_FMA
    - condition: flag(mavx)
      ghc-options:
        - -mavx
      cpp-options:
        - -DHAS_AVX

tests:
  pure-noise-test:
    main: Driver.hs
    source-dirs: test
    ghc-options:
      - -Wno-missing-export-lists
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - pure-noise
      - aeson >= 2.0 && < 2.3
      - aeson-pretty
      - bytestring
      - directory
      - filepath
      - JuicyPixels >= 3.3 && < 3.4
      - massiv >= 1.0 && < 2.0
      - tasty
      - tasty-discover
      - tasty-hunit
      - tasty-quickcheck
      - tasty-golden
      - text
      - typed-process


# NOTE: Benchmarks want +mfma & +mavx in your cabal.project if your host arch
# supports such.
benchmarks:
  pure-noise-bench:
    main: Bench.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-N -A32m -T"'
      - -O2
      - -fsimpl-tick-factor=1000
      # Nix requires us to be kinda explcit about the chain we want
      - -fllvm
      - -pgmlo opt
      - -pgmlc llc
      - -pgmlas clang
      - -optc-O3
      - -optlo-O3
      - -mavx
      - -mfma
    dependencies:
      - pure-noise
      - deepseq
      - massiv >= 1.0 && < 2.0
      - random
      - tasty
      - tasty-bench
      - vector >=0.12 && <0.14

  pure-noise-fnl-bench:
    main: FnlBench.hs
    source-dirs: bench/fnl-compare
    include-dirs: bench/fnl-compare/cbits
    cxx-sources: bench/fnl-compare/fnl_bench_shim.cpp
    cxx-options:
      - -O3
      - -std=c++14
      - -march=native
    ghc-options:
      - -threaded
      - -rtsopts
      # Single-threaded, large nursery should keep GC jitter low
      - '"-with-rtsopts=-A64m -T"'
      - -O2
      - -fsimpl-tick-factor=1000
      # Nix requires us to be kinda explcit about the chain we want
      - -fllvm
      - -pgmlo opt
      - -pgmlc llc
      - -pgmlas clang
      - -optc-O3
      - -optlo-O3
      - -mavx
      - -mfma
    dependencies:
      - pure-noise
      - mtl >=2.1 && < 2.4
      - splitmix ^>=0.1
      - tasty
      - tasty-bench >= 0.4 && < 0.6
      - vector >=0.12 && <0.14
    when:
      - condition: os(darwin)
        then:
          extra-libraries: c++
        else:
          extra-libraries: stdc++

flags:
  optimize:
    description: |
      Turns on -O2 for pure-noise. Since the library is pretty small, this shouldn't be
      too much trouble, but you can disable this flag if it's slowing your builds too
      much.

      Ratonale:
      - -O1 leaves ~3x on the table for tight noise loops in downstream code.
      - -O2 seems to produce higher-quality unfoldings, which in turn causes pure-noise's
      kernels to inline and optimize more reliably at call sites.
    default: true
    manual: true
  mfma:
    description: Compile with native fused-multiply-add instructions
    manual: true
    default: false
  mavx:
    description: Compile with AVX instructions
    manual: true
    default: false
