name: pure-noise
version: 0.3.0.0
github: "jtnuttall/pure-noise"
license: BSD-3-Clause
author: "Jeremy Nuttall"
maintainer: "jeremy@jeremy-nuttall.com"
copyright: "2026 Jeremy Nuttall"

tested-with:
  - GHC == 9.6.7
  - GHC == 9.8.4
  - GHC == 9.10.3
  - GHC == 9.12.4

extra-source-files:
  - README.md
  - LICENSE
  - LICENSE_FastNoiseLite
  # Required so pure-noise-fnl-bench builds from the sdist
  - bench/fnl-compare/cbits/FastNoiseLite.h

extra-doc-files:
  - CHANGELOG.md

synopsis: Performant, modern noise generation (Perlin, OpenSimplex2, Cellular)
category: Math, Numeric, Noise

description: |
  Fast, modern noise generation In pure Haskell with an algebraic interface.
  Provides Perlin, OpenSimplex2, OpenSimplex2S, Value, and Cellular noise variants.

language: GHC2021

dependencies:
  - base >= 4.16 && < 5
  - primitive >= 0.8 && < 0.10

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Numeric.Noise
    - Numeric.Noise.Cellular
    - Numeric.Noise.Fractal
    - Numeric.Noise.OpenSimplex
    - Numeric.Noise.Perlin
    - Numeric.Noise.SmootherSimplex
    - Numeric.Noise.Value
    - Numeric.Noise.ValueCubic
  when:
    - condition: flag(optimize)
      ghc-options:
        - -O2
    - condition: flag(mfma)
      ghc-options:
        - -mfma
      cpp-options:
        - -DHAS_FMA
    - condition: flag(mavx)
      ghc-options:
        - -mavx
      cpp-options:
        - -DHAS_AVX

tests:
  pure-noise-test:
    main: Driver.hs
    source-dirs: test
    ghc-options:
      - -Wno-missing-export-lists
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - pure-noise
      - aeson >= 2.0 && < 2.3
      - aeson-pretty
      - bytestring
      - directory
      - filepath
      - JuicyPixels >= 3.3 && < 3.4
      - massiv >= 1.0 && < 2.0
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - tasty-golden
      - text
      - typed-process
    build-tools:
      - tasty-discover

  pure-noise-doctest:
    main: Doctest.hs
    source-dirs: doctest
    ghc-options:
      - -threaded
    dependencies:
      - pure-noise
      - doctest-parallel ^>= 0.4

# NOTE: Benchmarks want +mfma & +mavx in your cabal.project if your host arch
# supports such.
# Published numbers additionally require +llvm-bench; see bench/README.md.
benchmarks:
  pure-noise-bench:
    main: Bench.hs
    source-dirs: bench
    ghc-options:
      - -threaded
      - -rtsopts
      - '"-with-rtsopts=-N -A32m -T"'
      - -O2
      - -fsimpl-tick-factor=1000
    when:
      - condition: flag(llvm-bench)
        ghc-options:
          # Nix requires us to be explicit about the toolchain. Pinned -pgm* also avoids picking up a
          # mismatched system LLVM.
          - -fllvm
          - -pgmlo opt
          - -pgmlc llc
          - -pgmlas clang # GHC >= 9.10
          - -mavx
          - -mfma # GHC >= 9.8
          # FP contraction happens in llc; this is where the FMA speedup
          - -optlc-fp-contract=fast
    dependencies:
      - pure-noise
      - deepseq
      - massiv >= 1.0 && < 2.0
      - random
      - tasty
      - tasty-bench
      - vector >=0.12 && <0.14

  pure-noise-fnl-bench:
    main: FnlBench.hs
    source-dirs: bench/fnl-compare
    include-dirs: bench/fnl-compare/cbits
    cxx-sources: bench/fnl-compare/fnl_bench_shim.cpp
    # Best-effort build FNL the way an ordinary Linux user's -O3 -march=native build behaves.
    # Explicit flags instead of -march=native because nix's cc wrapper strips -march=native
    # (NIX_ENFORCE_NO_NATIVE=1) and injects -fno-strict-overflow:
    cxx-options:
      - -O3
      - -std=c++14
      - -ffp-contract=fast
      - -fstrict-overflow
    ghc-options:
      - -threaded
      - -rtsopts
      # Single-threaded, large nursery should keep GC jitter low
      - '"-with-rtsopts=-A64m -T"'
      - -O2
      - -fsimpl-tick-factor=1000
      - -fspecialize-aggressively
      - -fexpose-all-unfoldings
      - -flate-specialise
      - -flate-dmd-anal
    dependencies:
      - pure-noise
      - mtl >=2.1 && < 2.4
      - splitmix ^>=0.1
      - tasty
      - tasty-bench >= 0.4 && < 0.6
      - vector >=0.12 && <0.14
    when:
      - condition: flag(llvm-bench)
        ghc-options:
          # See pure-noise-bench for rationale.
          - -fllvm
          - -pgmlo opt
          - -pgmlc llc
          - -pgmlas clang
          - -mavx
          - -mfma
          - -optlc-fp-contract=fast
      - condition: arch(x86_64)
        cxx-options:
          # Roughly what -march=native selects on 2015+ x86 (AVX2+FMA) without
          # being build-machine-dependent.
          - -march=x86-64-v3
      - condition: os(darwin)
        then:
          extra-libraries: c++
        else:
          extra-libraries: stdc++

flags:
  optimize:
    description: |
      Turns on expensive optimizations for pure-noise. Since the library is pretty small,
      this shouldn't be too much trouble, but you can disable this flag if it's slowing your
      builds too much.
    default: true
    manual: true
  mfma:
    description: Compile with native fused-multiply-add instructions
    manual: true
    default: false
  mavx:
    description: Compile with AVX instructions
    manual: true
    default: false
  llvm-bench:
    description: |
      Build the benchmark suites via GHC's LLVM backend with a pinned toolchain
      (-fllvm, -pgmlo opt, -pgmlc llc, -pgmlas clang) plus -mavx -mfma and fast
      FP contraction in llc (-optlc-fp-contract=fast). Requires opt/llc/clang
      on PATH (LLVM <= 19 for GHC 9.12) and GHC >= 9.10 (for -pgmlas). Off by
      default so `cabal build --enable-benchmarks` works on machines and CI
      runners without LLVM. Published benchmark numbers are collected with this
      flag on; see bench/README.md.
    default: false
    manual: true
