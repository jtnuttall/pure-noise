name: Haskell CI

on:
  push:
    branches: ["main", "next"]
  pull_request:
    branches: ["main", "next"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_BUST_VERSION: v1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - parallel:
          - run: nix flake check
          - name: doctest
            run: |
              nix develop '.#' --command \
                cabal run pure-noise-doctest \
                  --enable-tests \
                  --write-ghc-environment-files=always
          - name: haddock
            run: |
              nix develop '.#' --command \
                cabal haddock
          - name: Build benchmarks (+llvm-bench)
            run: |
              nix develop '.#' --command \
                cabal build all \
                  --enable-benchmarks \
                  --flags=+llvm-bench

  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        ghc:
          - "9.8.4"
          - "9.10.3"
          - "9.12.4"
          - "9.14.1"

    runs-on: ${{matrix.os}}

    name: GHC ${{matrix.ghc}}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haskell environment
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12.1.0"

      # Golden tests
      - name: Setup Node.js for odiff
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install odiff
        run: npm i -g odiff-bin@4.3.8

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('pure-noise.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Install and build
        shell: bash
        run: |
          cabal build all \
            --enable-tests \
            --enable-benchmarks
