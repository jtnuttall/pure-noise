name: Haskell CI

on:
  push:
    branches: ["main", "next"]
  pull_request:
    branches: ["main", "next"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_BUST_VERSION: v0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run fourmolu
        uses: haskell-actions/run-fourmolu@v12
        with:
          version: 0.20.0.0
        pattern: |
          {src,test,bench}/**/*.hs

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc:
          - "9.6.7"
          - "9.8.4"
          - "9.12.2"

    name: GHC ${{matrix.ghc}}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haskell environment
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12.1.0"

      # Golden tests rely on odiff
      - name: Setup Node.js for odiff
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install odiff
        run: npm i -g odiff-bin@4.3.8

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('pure-noise.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Install and build dependencies
        run: cabal build all --enable-tests --enable-benchmarks --only-dependencies

      - name: Run Tests
        run: cabal test all

      - name: Build Haddock
        run: cabal haddock

      # Just verify that the benchmark builds to avoid wasting CI minutes
      - name: Build benchmarks
        run: cabal build all --enable-benchmarks

      # Smoke-build the LLVM-gated benchmark configuration on the newest GHC only. Checks
      # buildability without wasting too many CI minutes.
      - name: Install LLVM 19 (llvm-bench smoke build)
        if: matrix.ghc == '9.12.2'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"

      - name: Build benchmarks (+llvm-bench)
        if: matrix.ghc == '9.12.2'
        run: cabal build all --enable-benchmarks --flags=+llvm-bench
