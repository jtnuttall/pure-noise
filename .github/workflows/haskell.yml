name: Haskell CI

on:
  push:
    branches: ["main", "next"]
  pull_request:
    branches: ["main", "next"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_BUST_VERSION: v0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run fourmolu
        uses: haskell-actions/run-fourmolu@v9
        with:
          version: 0.20.0.0

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc:
          - "9.6.7"
          - "9.8.4"
          - "9.12.2"

    name: GHC ${{matrix.ghc}}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Haskell environment
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.12.1.0"

      # Golden tests rely on odiff
      - name: Setup Node.js for odiff
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install odiff
        run: npm i -g odiff-bin

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('pure-noise.cabal', 'package.yaml') }}
          restore-keys: |
            ${{ env.CACHE_BUST_VERSION }}-${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Install and build dependencies
        run: cabal build all --enable-tests --enable-benchmarks --only-dependencies

      - name: Run Tests
        run: cabal test all

      - name: Build Haddock
        run: cabal haddock

      # Just verify that the benchmark builds to avoid wasting CI minutes
      - name: Build benchmarks
        run: cabal build all --enable-benchmarks
